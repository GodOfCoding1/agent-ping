[project]
name = "agentping"
version = "0.1.0"
description = "AgentPing backend: REST API, remote MCP server and durable push/scheduling worker."
requires-python = ">=3.13,<3.14"
dependencies = [
  "alembic>=1.16,<2",
  "certifi>=2026.1.4",
  "cryptography>=46,<51",
  "fastapi>=0.162,<1",
  "firebase-admin>=7.7,<8",
  "google-auth>=2.40,<3",
  "httpx>=0.28,<1",
  "mcp>=2.3,<3",
  "psycopg[binary]>=3.3,<4",
  "pydantic>=2.12,<3",
  "pydantic-settings>=2.10,<3",
  "pyjwt[crypto]>=2.10,<3",
  "python-dateutil>=2.9,<3",
  "sqlalchemy[asyncio]>=2.1,<3",
  "tzdata>=2025.2",
  "uvicorn>=0.35,<1",
]

[project.scripts]
agentping-api = "agentping.api.main:main"
agentping-worker = "agentping.worker.main:main"
agentping-admin = "agentping.cli:main"
agentping-mcp-stdio = "agentping.mcp.stdio_proxy:main"

[dependency-groups]
dev = [
  "mypy>=1.18,<2",
  "pytest>=8.4,<10",
  "pytest-asyncio>=1.2,<2",
  "ruff>=0.13,<1",
  "types-python-dateutil>=2.9",
]

[build-system]
requires = ["uv_build>=0.9,<0.14"]
build-backend = "uv_build"

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"migrations/versions/*.py" = ["E501"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Header", "fastapi.Path"]

[tool.mypy]
python_version = "3.13"
check_untyped_defs = true
disallow_untyped_defs = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests", "../infra/tests"]
pythonpath = ["../infra", "."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
filterwarnings = ["ignore::DeprecationWarning:google.*"]
