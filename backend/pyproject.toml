[project]
name = "agentping-development"
version = "0.0.0"
description = "AgentPing development toolchain; application implementation is pending."
requires-python = ">=3.13,<3.14"
dependencies = [
  "alembic>=1.16,<2",
  "fastapi>=0.162,<1",
  "firebase-admin>=7.7,<8",
  "google-auth>=2.40,<3",
  "httpx>=0.28,<1",
  "mcp>=2.3,<3",
  "psycopg[binary]>=3.3,<4",
  "pydantic>=2.12,<3",
  "pydantic-settings>=2.10,<3",
  "sqlalchemy[asyncio]>=2.1,<3",
  "uvicorn>=0.35,<1",
]

[dependency-groups]
dev = [
  "mypy>=1.18,<2",
  "pytest>=8.4,<10",
  "pytest-asyncio>=1.2,<2",
  "ruff>=0.13,<1",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.13"
check_untyped_defs = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["../infra/tests"]
pythonpath = ["../infra"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
