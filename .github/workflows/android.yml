name: Android development checks

on:
  push:
    paths: ["android/**", "infra/android_env.py", "dev", ".github/workflows/android.yml"]
  pull_request:
    paths: ["android/**", "infra/android_env.py", "dev", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Install pinned Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Build, unit-test task and lint without private configuration
        working-directory: android
        run: ./gradlew :app:assembleDebug :app:testDebugUnitTest :app:lintDebug -Pagentping.firebaseEnabled=false --console=plain
